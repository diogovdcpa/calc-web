{% extends "layout.html" %}
{% block content %}
<div class="card">
    <h1>Criar conta</h1>
    <p class="muted">Cadastre-se e vincule-se a uma empresa para começar a dimensionar.</p>
    <form method="post" class="mt-2">
        <label for="name">Nome</label>
        <input id="name" name="name" type="text" required placeholder="Seu nome">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="voce@empresa.com">

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required>

        <label for="company">Empresa</label>
        <input id="company" name="company" type="text" required placeholder="Nome da empresa">

        <div class="actions mt-2">
            <button class="btn btn-primary" type="submit">Cadastrar</button>
            <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Já tenho conta</a>
        </div>
    </form>
</div>
{% endblock %}
