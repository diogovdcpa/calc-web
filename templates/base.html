<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestao de Ativos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ink: #f5f5f7;
            --muted: rgba(245, 245, 247, 0.72);
            --muted-strong: rgba(245, 245, 247, 0.86);
            --paper: #0b0b0e;
            --panel: rgba(20, 20, 24, 0.8);
            --panel-strong: rgba(12, 12, 16, 0.92);
            --accent: #e10600;
            --accent-strong: #ff2a1a;
            --accent-soft: rgba(225, 6, 0, 0.22);
            --line: rgba(255, 255, 255, 0.14);
        }
        body {
            font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(900px 700px at 12% 10%, rgba(225, 6, 0, 0.28), rgba(11, 11, 14, 0.12) 50%, rgba(11, 11, 14, 0.9) 100%),
                radial-gradient(700px 500px at 90% 25%, rgba(255, 42, 26, 0.18), rgba(11, 11, 14, 0) 60%),
                linear-gradient(140deg, #0b0b0e 0%, #141418 45%, #0d0d10 100%);
            min-height: 100vh;
        }
        .brand-title {
            font-family: "Fraunces", "Times New Roman", serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .glass-card {
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
        }
        .float-orb {
            background: radial-gradient(circle at 30% 30%, rgba(225, 6, 0, 0.75), rgba(225, 6, 0, 0));
            animation: float 8s ease-in-out infinite;
        }
        .text-emerald-950,
        .text-emerald-900 {
            color: var(--ink);
        }
        .text-emerald-900\/80 {
            color: var(--muted);
        }
        .text-emerald-800 {
            color: var(--muted-strong);
        }
        .bg-emerald-900\/5 {
            background-color: rgba(255, 255, 255, 0.06);
        }
        .bg-white {
            background: linear-gradient(120deg, var(--accent) 0%, var(--accent-strong) 100%);
        }
        .bg-white\/70 {
            background-color: rgba(14, 14, 18, 0.7);
        }
        .bg-white\/90 {
            background-color: rgba(10, 10, 14, 0.92);
        }
        .bg-white\/5 {
            background-color: rgba(255, 255, 255, 0.04);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 9999px;
            border: 1px solid var(--line);
            padding: 0.5rem 1.25rem;
            font-size: 0.875rem;
            line-height: 1.2;
            color: var(--ink);
            background-color: rgba(14, 14, 18, 0.7);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(0, 0, 0, 0.35);
        }
        .btn-primary {
            background: linear-gradient(120deg, var(--accent) 0%, var(--accent-strong) 100%);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 12px 24px rgba(225, 6, 0, 0.28);
        }
        .btn-primary:hover {
            box-shadow: 0 18px 30px rgba(225, 6, 0, 0.38);
        }
        .btn-ghost {
            background-color: rgba(14, 14, 18, 0.6);
        }
        .btn-outline {
            background-color: transparent;
            border-color: rgba(255, 255, 255, 0.28);
            color: var(--ink);
        }
        .btn-xs {
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
        }
        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 0.35rem 0.9rem;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(245, 245, 247, 0.65);
            background: rgba(12, 12, 16, 0.9);
            box-shadow: inset 0 0 0 1px rgba(225, 6, 0, 0.1);
        }
        .stat-pill strong {
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #ffffff;
        }
        .stat-pill--soft {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }
        .border-black\/10 {
            border-color: var(--line);
        }
        .border-black\/80 {
            border-color: var(--accent);
        }
        .divide-black\/10 > :not([hidden]) ~ :not([hidden]) {
            border-color: var(--line);
        }
        input,
        textarea,
        select {
            color: var(--ink);
        }
        input::placeholder,
        textarea::placeholder {
            color: rgba(245, 245, 247, 0.5);
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent-strong) !important;
            box-shadow: 0 0 0 2px var(--accent-soft) !important;
        }
        .fade-in {
            animation: fade-in 0.9s ease-out both;
        }
        .rise-in {
            animation: rise 0.9s ease-out both;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
